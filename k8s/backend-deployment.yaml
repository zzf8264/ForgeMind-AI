apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgemind-backend
  namespace: forgemind
spec:
  replicas: 3
  selector:
    matchLabels:
      app: forgemind-backend
  template:
    metadata:
      labels:
        app: forgemind-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/forgemind-ai/backend:latest
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: production
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: forgemind-backend
  namespace: forgemind
spec:
  selector:
    app: forgemind-backend
  ports:
    - port: 8000
      targetPort: 8000
