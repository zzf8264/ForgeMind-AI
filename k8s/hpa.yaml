apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: forgemind-backend
  namespace: forgemind
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: forgemind-backend
  minReplicas: 3
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
